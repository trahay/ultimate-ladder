services:
  web:
    build: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8001"]
    volumes:
      - .:/code
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    env_file: .env
    volumes: 
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      # -h localhost: during its first initialization, postgres runs a temporary
      # server that only listens on a unix socket. Do not report it as ready.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres18_data:
