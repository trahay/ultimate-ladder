services:
  web:
    build: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8001"]
    volumes:
      - .:/code
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    env_file: .env
    volumes: 
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
