{% extends 'ultimate_ladder/base.html' %}
	
{% block content %}

{% if user.is_authenticated %}
<article>
	<form method="post">
		{% csrf_token %}
		<h2>Delete league</h2>
		<p>Are you sure that you want to delete "{{league}}"?</p>
		<div class="actions">
			<button type="submit"><i class="bi bi-trash" aria-hidden="true"></i> Delete</button>
			<a href="{% url 'leagues' league.owner %}" role="button" class="secondary outline">Cancel</a>
		</div>
	</form>
</article>
{% endif %}
{% endblock content %}
