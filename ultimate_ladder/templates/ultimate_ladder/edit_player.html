{% extends 'ultimate_ladder/base.html' %}
	
{% block content %}

{% if user.is_authenticated %}
<h1>{% if player %}Edit {{ player.name }}{% else %}New player{% endif %}</h1>

<form method="post">{% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit">Save</button>
        <a href="{% if player %}{% url 'player' player.owner player.id %}{% else %}{% url 'players' user %}{% endif %}" role="button" class="secondary outline">Cancel</a>
    </div>
</form>
{% endif %} 

{% endblock content %}
