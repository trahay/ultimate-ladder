{% extends 'ultimate_ladder/base.html' %}
	
{% block content %}

{% if user.is_authenticated %}
<h1>{% if league %}Edit {{ league.name }}{% else %}New league{% endif %}</h1>

<form method="post">{% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit">Save</button>
        <a href="{% if league %}{% url 'league' league.owner league.id %}{% else %}{% url 'leagues' user %}{% endif %}" role="button" class="secondary outline">Cancel</a>
    </div>
</form>
{% endif %}

{% endblock content %}
