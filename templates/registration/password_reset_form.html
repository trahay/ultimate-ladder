{% extends "ultimate_ladder/base.html" %}
{% load i18n %}

{% block content %}
<article class="login">
  <h1>{% translate "Lost password" %}</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form.email.errors }}
    <label for="{{ form.email.id_for_label }}">{% translate "Email" %}</label>
    {{ form.email }}
    <button type="submit">{% translate "Reset password" %}</button>
  </form>
</article>
{% endblock %}
